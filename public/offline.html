<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline | Mohammed Awal Portfolio</title>
  <meta name="theme-color" content="#4f46e5" />
  <style>
    :root {
      color-scheme: dark light;
      --bg: #08080c;
      --surface: #111117;
      --border: #24242e;
      --fg: #f3f3f7;
      --muted: #a4a5b5;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f7f7f9;
        --surface: #ffffff;
        --border: #e4e4ec;
        --fg: #0c0c14;
        --muted: #55576a;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 16px 36px -12px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(79, 70, 229, 0.12);
      border: 1px solid rgba(79, 70, 229, 0.25);
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .icon-badge svg {
      width: 36px;
      height: 36px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: 9999px;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.6);
    }
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .secondary-link {
      display: block;
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>
      You are viewing this portfolio in standalone offline mode. Previously visited pages remain available, or tap below to reconnect.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <a class="secondary-link" href="/">Go to Cached Home</a>
  </div>
</body>
</html>
